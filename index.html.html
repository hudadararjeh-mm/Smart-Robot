<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الروبوت الذكي (3) – المتغيرات والتعبيرات الشرطية</title>
<style>
:root{--bg:#eef4fc;--card:#fff;--tx:#0b2a5b;--mut:#4b6a99;--b9:#0b2a5b;--b7:#1456a8;--b5:#2f80d6;--b2:#dbeafe;--ok:#0f9d58;--okb:#dcf5e7;--no:#c62828;--nob:#fde4e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07142b;--card:#0e2347;--tx:#e6f0ff;--mut:#9db8e0;--b9:#050e20;--b7:#2f80d6;--b5:#5aa0ec;--b2:#17315f;--okb:#0f3a28;--nob:#431616}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(90deg,var(--b9),var(--b7));color:#fff;padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--b9);z-index:10}
header h1{font-size:16px;margin:0;flex:1}.chip{background:rgba(255,255,255,.18);border-radius:20px;padding:2px 12px;font-size:13px;white-space:nowrap}
.prog{height:6px;background:var(--b2)}.prog i{display:block;height:100%;background:var(--b5);transition:width .4s}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 4px 18px rgba(11,42,91,.12);border-top:5px solid var(--b7)}
h2{margin:0 0 4px;color:var(--b7)}h3{margin:12px 0 6px}.sub{color:var(--mut);font-size:14px;margin-bottom:10px}
.tag{display:inline-block;background:var(--b2);color:var(--b7);border-radius:8px;padding:1px 10px;font-size:13px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.box{background:var(--b2);border-radius:12px;padding:14px}.big{font-size:44px;text-align:center}
button,.btn{font:inherit;cursor:pointer;border:2px solid var(--b7);background:var(--card);color:var(--b7);border-radius:12px;padding:8px 16px;transition:.15s}
button:hover:not(:disabled){background:var(--b7);color:#fff}button:disabled{cursor:default;opacity:.85}
.pri{background:var(--b7);color:#fff}.ok{background:var(--okb)!important;border-color:var(--ok)!important;color:var(--ok)!important}.no{background:var(--nob)!important;border-color:var(--no)!important;color:var(--no)!important}
.opts{display:grid;gap:8px}.opts button{text-align:right}
.fb{margin-top:10px;padding:10px 14px;border-radius:10px;display:none}.fb.ok{display:block}.fb.no{display:block}
nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.qh{display:flex;justify-content:space-between;font-weight:700;color:var(--b7)}.bar{height:8px;background:var(--b2);border-radius:6px;margin:6px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--b7);transition:width .3s}
input[type=text],input[type=number]{font:inherit;padding:8px 12px;border:2px solid var(--b5);border-radius:10px;background:var(--card);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.row .lab{flex:1;min-width:160px}
table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}td,th{border:1px solid var(--b2);padding:6px 10px}
code{background:var(--b2);border-radius:6px;padding:1px 8px;direction:ltr;display:inline-block}
.ev{font-size:13px;color:var(--mut);margin-top:12px;border-top:1px dashed var(--b5);padding-top:6px}
</style>
</head>
<body>
<header><h1>🤖 الروبوت الذكي (3) – الصف السابع</h1><span class="chip" id="min"></span><span class="chip">⏱ الحصة <b id="clk">45:00</b></span></header>
<div class="prog"><i id="pg"></i></div>
<main><div id="app"></div><nav id="nav"><button id="pv">→ السابق</button><button class="pri" id="nx">التالي ←</button></nav></main>
<script>
const $=s=>document.querySelector(s),app=$("#app");let cur=0,TM=[],lessonT=null,left=45*60;
const clr=()=>{TM.forEach(clearInterval);TM=[]};
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const ev=t=>`<div class="ev">📌 دليل التحقق والمعايير: ${t}</div>`;
const lvl=(s,n)=>{const p=s/n;return p>=.8?["ok","🌟 مستوى الإتقان: أنتِ جاهزة للتحدي الإثرائي! صمّمي موقفًا لروبوت يستخدم متغيرًا وشرطًا معًا (مثال: إذا كانت قيمة المتغير «البطارية» أصغر من 20 فسيطلب الروبوت الشحن) واشرحيه لزميلاتك."]:p>=.5?["ok","👍 مستوى متوسط: راجعي بطاقة الدعم (المتغير = اسم + نوع + قيمة، والشرط = فحص ناتجه صواب أو خطأ) ثم أعيدي المحاولة."]:["no","🛠️ نشاط علاجي: اجلسي مع معلمتك أو زميلة متقنة، وطبّقي مثال «سرعة الروبوت» خطوة بخطوة: سمّي المتغير، اختاري نوعه، غيّري قيمته، ثم اكتبي شرطًا عليه."]};
function quiz(box,qs,done,sec=30){let i=0,s=0;const show=()=>{clr();if(i>=qs.length)return done(s);const q=qs[i],ord=shuf(q.o.map((_,k)=>k));let l=sec,a=false;
box.innerHTML=`<div class="qh"><span>سؤال ${i+1} من ${qs.length}</span><span>⏱ <b id="qt">${l}</b> ث</span></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><h3>${q.q}</h3><div class="opts">${ord.map(k=>`<button data-k="${k}">${q.o[k]}</button>`).join("")}</div><div class="fb" id="fb"></div>`;
const fin=(k)=>{if(a)return;a=true;clr();const ok=k===q.a;if(ok)s++;box.querySelectorAll("button").forEach(b=>{b.disabled=true;if(+b.dataset.k===q.a)b.classList.add("ok");else if(+b.dataset.k===k)b.classList.add("no")});const f=$("#fb");f.className="fb "+(ok?"ok":"no");f.innerHTML=(k<0?"⏰ انتهى الوقت. ":ok?"✅ إجابة صحيحة! ":"❌ ليست دقيقة. ")+q.f+`<br><button class="pri" id="qn" style="margin-top:8px">${i+1<qs.length?"السؤال التالي":"عرض النتيجة"}</button>`;$("#qn").onclick=()=>{i++;show()}};
box.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>fin(+b.dataset.k));TM.push(setInterval(()=>{l--;const e=$("#qt");if(e)e.textContent=l;if(l<=0)fin(-1)},1000))};show()}
function classify(box,items,choices){let n=0,d=0;box.innerHTML=items.map((it,i)=>`<div class="row" data-i="${i}"><span class="lab">${it[0]}</span>${choices.map((c,k)=>`<button data-k="${k}">${c}</button>`).join("")}<span class="why"></span></div>`).join("")+`<p id="sc" class="sub"></p>`;
box.querySelectorAll(".row").forEach(r=>r.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(r.dataset.d)return;r.dataset.d=1;d++;const it=items[+r.dataset.i],ok=+b.dataset.k===it[1];if(ok)n++;b.classList.add(ok?"ok":"no");if(!ok)r.querySelectorAll("button")[it[1]].classList.add("ok");r.querySelector(".why").textContent=(ok?"✅ ":"❌ ")+it[2];$("#sc").textContent=`أنجزتِ ${d} من ${items.length} – الصحيحة: ${n}`}))}
const G1=[{q:"أي عبارة توضّح مفهوم لبنة المتغير (Variable)؟",o:["موقع في ذاكرة الحاسوب يخزّن بيانات ويمكن تغيير قيمته","أمر يجعل الروبوت يتحرك للأمام","لبنة تقارن بين قيمتين وتعطي صوابًا أو خطأ","محرك يُدير عجلات الروبوت"],a:0,f:"المتغير موقع في الذاكرة له اسم ونوع وقيمة."},
{q:"أكملي: يستخدم الروبوت لبنة المتغير لكي ______ سرعته داخل البرنامج.",o:["يحتفظ بقيمة","يطفئ","يقارن بين","يرسم"],a:0,f:"وظيفة المتغير تخزين القيمة والاحتفاظ بها لاستخدامها لاحقًا."},
{q:"المتغير «السرعة» قيمته 30، ثم نفّذ الروبوت أمر «اجعل السرعة 60». ماذا حدث للمتغير؟",o:["حلّت القيمة 60 محل القيمة 30","بقيت القيمتان معًا","حُذف المتغير","تغيّر اسم المتغير إلى 60"],a:0,f:"يحتفظ المتغير بقيمة واحدة في كل لحظة، وعند التعيين تُستبدل القيمة القديمة."},
{q:"المتغير «اسم_الروبوت» يحمل الكلمة «سبايك». ما نوع هذا المتغير؟",o:["نصي Text","رقمي Numeric","منطقي Boolean","ليس متغيرًا"],a:0,f:"الكلمات والعبارات تُخزَّن في متغير نصي."},
{q:"لماذا نستخدم متغيرًا بدل كتابة الرقم نفسه في كل مكان بالبرنامج؟",o:["لنخزّن القيمة مرة واحدة ونستخدمها ونغيّرها بسهولة","لأن الروبوت لا يفهم الأرقام","ليصبح البرنامج أبطأ","لا فائدة منه"],a:0,f:"المتغير يمنح القيمة اسمًا يمكن استدعاؤه وتحديثه من أي موضع."}];
const G2=[{q:"أي مما يلي يمثّل تعبيرًا شرطيًا؟",o:["إذا كانت الحرارة أعلى من 40 فسيتوقف الروبوت","اجعل السرعة 50","اسم الروبوت سبايك","تحرّك للأمام 10 خطوات"],a:0,f:"التعبير الشرطي يفحص شرطًا ويترتب عليه نتيجة."},
{q:"ما وظيفة التعبير الشرطي؟",o:["التحقق من شرط معين وتكون نتيجته صوابًا أو خطأ","تخزين قيمة في الذاكرة","تحريك محرك الروبوت","تسمية الروبوت"],a:0,f:"الشرط يُختبر فتكون نتيجته True أو False، وبناءً عليها يقرر الروبوت."},
{q:"أي الخيارات التالية مثال صحيح على تعبير شرطي في LEGO SPIKE؟",o:["المسافة < 20","ابدأ البرنامج","شغّل صوت قطة","اجعل الضوء أحمر"],a:0,f:"«المسافة < 20» عبارة تُفحَص فتنتج صوابًا أو خطأ."},
{q:"تريدين التحقق من أن سرعة الروبوت أقل من 20. أي لبنة مقارنة تناسب ذلك؟",o:["أصغر من <","أكبر من >","يساوي =","لا شيء منها"],a:0,f:"«أقل من» تعني أصغر من، فنستخدم <."},
{q:"ما الفرق بين المتغير والتعبير الشرطي؟",o:["المتغير يخزّن قيمة، والشرطي يفحص شرطًا","هما الشيء نفسه","المتغير يفحص والشرطي يخزّن","كلاهما يحرّك الروبوت"],a:0,f:"المتغير للتخزين، والتعبير الشرطي للتحقق واتخاذ القرار."}];
const GF=[{q:"أي عبارة تشرح معنى لبنة المتغير؟",o:["صندوق في الذاكرة له اسم ونوع وقيمة قابلة للتغيير","أمر يجعل الروبوت يدور","لبنة تُصدر صوتًا","جهاز استشعار"],a:0,f:"هذا هو تعريف المتغير."},
{q:"روبوت يعدّ الأجسام التي يمر بها. لماذا يحتاج إلى متغير؟",o:["ليتذكّر العدد ويزيده كل مرة","ليتحرك أسرع","ليغيّر لون الضوء","ليقارن لونين"],a:0,f:"المتغير يحتفظ بالقيمة (العدد) ويُحدَّث عند كل جسم جديد."},
{q:"المتغير «الباب_مفتوح» قيمته صواب أو خطأ. ما نوعه؟",o:["منطقي Boolean","رقمي Numeric","نصي Text","لا نوع له"],a:0,f:"القيم صواب/خطأ تُخزَّن في متغير منطقي."},
{q:"أي موقف يمثّل تعبيرًا شرطيًا؟",o:["هل المسافة أكبر من 10؟","خزّني الاسم «سبايك»","اجعل الصوت عاليًا","ابدئي من الصفر"],a:0,f:"السؤال عن تحقق أمر ما يُنتج صوابًا أو خطأ، وهذه سمة الشرط."},
{q:"ما ناتج التعبير الشرطي دائمًا؟",o:["صواب أو خطأ","رقم فقط","كلمة فقط","لا ناتج له"],a:0,f:"نتيجة الشرط منطقية: True أو False."},
{q:"لفحص ما إذا كان لون المستشعر يساوي الأزرق، أي لبنة تستخدمين؟",o:["يساوي =","أكبر من >","أصغر من <","متغير نصي"],a:0,f:"فحص التطابق يتم بلبنة «يساوي»."}];

const S=[
{m:3,t:"تهيئة الدرس",h:`<h2>🤖 الروبوت الذكي (3)</h2><p class="sub">درس البرمجة – الصف السابع</p><div class="box"><h3>موقف افتتاحي</h3><p>روبوت يسير في ممر المدرسة؛ يجب أن «يتذكّر» سرعته، و«يقرّر» متى يتوقف إذا اقترب من حاجز. <b>كيف يتذكّر؟ وكيف يقرّر؟</b></p></div><div class="grid" style="margin-top:12px"><div class="box">💬 فكّري ثم شاركي زميلتك (دقيقة)</div><div class="box">🎯 سنجيب في نهاية الحصة بأنفسنا</div></div>${ev("تهيئة عامة تثير الدافعية وتربط التعلم بسياق واقعي (التخطيط للدرس).")}`},
{m:2,t:"أهداف الدرس",h:`<h2>🎯 أهداف الدرس</h2><div class="grid"><div class="box"><div class="big">1️⃣</div><b>أن توضّح الطالبة مفهوم لبنة المتغير (Variable).</b></div><div class="box"><div class="big">2️⃣</div><b>أن تميّز الطالبة مفهوم التعبير الشرطي.</b></div></div>${ev("أهداف قابلة للقياس، يقابل كل هدف غلق بنائي فردي وغلق ختامي.")}`},
{m:1,t:"مصطلحات الدرس",h:`<h2>📘 مصطلحات الدرس</h2><table><tr><th>المصطلح</th><th>المعنى</th></tr><tr><td>متغير Variable</td><td>موقع في ذاكرة الحاسوب يُستخدم لتخزين البيانات، ولكل متغير اسم ونوع</td></tr><tr><td>رقمية Numeric / نصية Text / منطقية Boolean</td><td>أنواع البيانات التي يخزّنها المتغير</td></tr><tr><td>تعبير شرطي</td><td>مفهوم برمجي يُستخدم لاتخاذ القرارات بناءً على شرط معين</td></tr><tr><td>True / False</td><td>صواب / خطأ</td></tr><tr><td>لبنات المقارنة</td><td>Greater Than أكبر من، Less Than أصغر من، Equal المساواة</td></tr></table>`},
{m:2,t:"الهدف 1 – تهيئة",h:`<span class="tag">الهدف 1</span><h2>كيف يحتفظ الروبوت بقيمة سرعته؟</h2><div class="box"><div class="big">🤖 ⚡ 45</div><p>الروبوت يتحرك بسرعة 45 الآن، وبعد ثوانٍ سيحتاج هذه القيمة مرة أخرى.</p></div><h3>أسئلة سابرة</h3><p>• أين يمكن أن «يحفظ» الروبوت الرقم؟ • ماذا لو تغيّرت السرعة إلى 60؟ هل نحتاج رقمًا جديدًا أم مكانًا يتغير؟</p>${ev("أسئلة سابرة تكشف المعرفة السابقة وتوجّه التعلم النشط.")}`},
{m:3,t:"اكتشاف المتغير",init(e){let v=0;const r=()=>{$("#vv").textContent=v};e.querySelector("#plus").onclick=()=>{v+=5;r()};e.querySelector("#minus").onclick=()=>{v-=5;r()};e.querySelector("#set").onclick=()=>{const x=+$("#inp").value;if(!isNaN(x)){v=x;r()}}},h:`<span class="tag">الهدف 1</span><h2>اكتشفي: صندوق الذاكرة</h2><div class="grid"><div class="box" style="text-align:center"><div>📦 اسم المتغير: <b>السرعة</b></div><div class="big" id="vv">0</div><div class="sub">القيمة الابتدائية 0 ← الروبوت متوقف</div><div class="row" style="justify-content:center"><button id="minus">−5</button><button id="plus">+5</button></div><div class="row" style="justify-content:center"><input type="number" id="inp" placeholder="قيمة جديدة" style="width:130px"><button id="set" class="pri">تخزين</button></div></div><div class="box"><h3>استنتجي</h3><p>• ماذا حدث للقيمة القديمة عند التخزين؟<br>• هل بقي اسم الصندوق كما هو؟<br>• ما فائدة الصندوق للروبوت؟</p></div></div>${ev("نشاط اكتشاف بصري تفاعلي يبني المفهوم قبل تعريفه.")}`},
{m:4,t:"شرح المتغير وأنواعه",h:`<span class="tag">الهدف 1</span><h2>لبنة المتغير</h2><div class="box"><b>المتغير:</b> موقع في الذاكرة يُستخدم لتخزين البيانات، ولكل متغير <b>اسم</b> و<b>نوع</b> (وله <b>قيمة</b> مخزّنة). وهناك ثلاثة أنواع: رقمية Numeric، نصية Text، منطقية Boolean.</div><div class="box" style="margin-top:8px">🧱 أول لبنة نستخدمها في برنامجنا هي لبنة <b>المتغير Variable</b> الموجودة في لوحة <b>المتغيرات Variables</b>، وتتيح لنا إنشاء المتغيرات وتعريفها. سننشئ متغيرًا رقميًا لتمثيل <b>السرعة</b> بقيمة ابتدائية تساوي <b>الصفر</b>، فيكون الروبوت متوقفًا في البداية.</div><h3>أنواع المتغيرات</h3><div class="grid"><div class="box"><b>🔢 رقمي Numeric</b><br>السرعة = 45</div><div class="box"><b>🔤 نصي Text</b><br>اسم_الروبوت = «سبايك»</div><div class="box"><b>✅ منطقي Boolean</b><br>حاجز_أمامي = صواب</div></div>${ev("شرح موجز مدعوم بأمثلة من الروبوت (توظيف التقنية والتمثيلات المتعددة).")}`},
{m:5,t:"نشاط جماعي: صندوق ذاكرة الروبوت",init(e){classify(e.querySelector("#c"),[["سرعة الروبوت = 45",0,"رقم، إذن متغير رقمي."],["اسم الروبوت = «سبايك»",1,"كلمة، إذن متغير نصي."],["هل يوجد حاجز؟ = صواب",2,"صواب/خطأ، إذن متغير منطقي."],["عدد الدورات = 3",0,"رقم يمكن زيادته، إذن رقمي."],["رسالة الترحيب = «مرحبًا»",1,"عبارة، إذن نصي."]],["رقمي","نصي","منطقي"])},h:`<span class="tag">استراتيجية جماعية</span><h2>📦 صندوق ذاكرة الروبوت</h2><p class="sub">تعاوني مع مجموعتك لتربطي كل بيانة بالنوع المناسب، ثم ناقشا الأسئلة.</p><div id="c"></div><div class="box" style="margin-top:10px"><b>تعرض كل مجموعة:</b> كيف يستفيد الروبوت من تخزين هذه البيانات؟ ولماذا اخترتم هذا المتغير؟</div>${ev("تعلم تعاوني بأدوار (قارئة، مسجّلة، متحدثة) وتغذية راجعة فورية.")}`},
{m:4,t:"غلق بنائي 1: اكتشفي المتغير",init(e){quiz(e.querySelector("#q"),G1,s=>{const[c,t]=lvl(s,5);e.querySelector("#q").innerHTML=`<h2>نتيجتك: ${s} / 5</h2><div class="fb ${c}">${t}</div>`})},h:`<span class="tag">غلق بنائي فردي</span><h2>🎮 اكتشفي المتغير</h2><div id="q"></div>${ev("قياس فردي للهدف 1 مع تغذية راجعة فورية ودعم/إثراء بحسب النتيجة (التمايز).")}`},
{m:3,t:"الهدف 2 – تهيئة",h:`<span class="tag">الهدف 2</span><h2>الأسلوب الشرطي في اللغة العربية</h2><p><b>ما المقصود بالأسلوب الشرطي؟</b></p><div class="grid"><div class="box"><b>مثال لغوي:</b><br>«إذا اجتهدتِ في دراستكِ، فإنكِ تحققين النجاح»<br><span class="tag">الشرط: اجتهدتِ</span><span class="tag">النتيجة: تحققين النجاح</span></div><div class="box"><b>مثال برمجي:</b><br>«إذا كانت سرعة الروبوت أكبر من 50، فسيصدر تنبيهًا»<br><span class="tag">الشرط: السرعة &gt; 50</span><span class="tag">النتيجة: تنبيه</span></div></div>${ev("ربط بين المواد (العربية والحوسبة) وانتقال من المألوف إلى الجديد.")}`},
{m:2,t:"اكتشاف التعبير الشرطي",init(e){const u=()=>{const v=+$("#sp").value;$("#sv").textContent=v;const r=v>50;$("#rs").textContent=r?"صواب (True) → 🔔 تنبيه!":"خطأ (False) → لا تنبيه";$("#rs").className="box "+(r?"ok":"no")};$("#sp").oninput=u;u()},h:`<span class="tag">الهدف 2</span><h2>اكتشفي: متى يتحقق الشرط؟</h2><div class="box"><div>السرعة = <b id="sv"></b></div><input type="range" id="sp" min="0" max="100" value="30" style="width:100%"><div>الشرط: <code>السرعة &gt; 50</code></div><div id="rs" class="box" style="margin-top:8px"></div></div><div class="box"><b>التعبير الشرطي:</b> مفهوم برمجي يُستخدم لاتخاذ القرارات بناءً على شرط معين؛ فإذا تحقق الشرط تُنفَّذ لبنات برمجية محددة، وإذا لم يتحقق تُنفَّذ لبنات أخرى. ونتيجته إما <b>صواب (True)</b> أو <b>خطأ (False)</b>.</div>${ev("تجربة تفاعلية تقود الطالبة لاستنتاج المفهوم بنفسها.")}`},
{m:3,t:"لبنات المقارنة (LEGO SPIKE)",h:`<span class="tag">الهدف 2</span><h2>لبنات المقارنة</h2><div class="grid"><div class="box"><div class="big">&gt;</div><b>Greater Than أكبر من</b><br><code>السرعة &gt; 50</code></div><div class="box"><div class="big">&lt;</div><b>Less Than أصغر من</b><br><code>المسافة &lt; 10</code></div><div class="box"><div class="big">=</div><b>Equal المساواة</b><br><code>اللون = أحمر</code></div></div><table><tr><th>اللبنة</th><th>الاستخدام</th></tr><tr><td>Less Than (&lt;)</td><td>تقارن بين قيمتين: تعيد True إذا كانت القيمة اليسرى أصغر من اليمنى، وFalse إذا كانت أكبر أو تساويها.</td></tr><tr><td>Equal (=)</td><td>تعيد True إذا كانت القيمتان متساويتين، وFalse إذا كانتا غير متساويتين.</td></tr><tr><td>Greater Than (&gt;)</td><td>تعيد True إذا كانت القيمة اليسرى أكبر من اليمنى، وFalse إذا كانت أصغر أو تساويها.</td></tr></table><h3>أمثلة من الكتاب</h3><p><code>5&lt;7</code> ← TRUE &nbsp; <code>10=3</code> ← FALSE &nbsp; <code>4&gt;2</code> ← TRUE</p><details class="box"><summary><b>تدريب:</b> إذا كانت X=4 وY=2 فما نتيجة كل تعبير؟ (اضغطي للإجابة)</summary><p><code>X&gt;Y</code> True · <code>X=Y</code> False · <code>X-2=Y</code> True · <code>Y+3&gt;X</code> True</p></details>${ev("أمثلة مستمدة من بيئة LEGO SPIKE لتعزيز التطبيق العملي.")}`},
{m:5,t:"نشاط جماعي: قرار الروبوت الذكي",init(e){classify(e.querySelector("#c"),[["يصدر الروبوت تنبيهًا إذا كانت السرعة أكبر من 50",0,"الكلمة «أكبر» تقابل >."],["يتوقف إذا كانت المسافة أصغر من 10",1,"«أصغر» تقابل <."],["ينعطف إذا كان لون المستشعر يساوي الأحمر",2,"فحص التطابق يتم بلبنة =."],["يضيء المصباح إذا زادت الحرارة عن 40",0,"«زادت عن» تعني أكبر من >."]],[">","<","="])},h:`<span class="tag">استراتيجية تفاعلية</span><h2>🧭 قرار الروبوت الذكي</h2><p class="sub">ناقشي مع مجموعتك العلاقة بين الشرط والنتيجة، ثم اختاري لبنة المقارنة وفسّري اختيارك.</p><div id="c"></div>${ev("مناقشة جماعية بأسئلة سابرة: لماذا هذه اللبنة؟ ماذا لو غيّرنا القيمة؟")}`},
{m:4,t:"غلق بنائي 2: خبيرة الشروط",init(e){quiz(e.querySelector("#q"),G2,s=>{const[c,t]=lvl(s,5);e.querySelector("#q").innerHTML=`<h2>نتيجتك: ${s} / 5</h2><div class="fb ${c}">${t}</div>`})},h:`<span class="tag">غلق بنائي فردي</span><h2>🎮 خبيرة الشروط</h2><div id="q"></div>${ev("قياس فردي للهدف 2 مع تغذية راجعة فورية وتمايز (دعم/إثراء).")}`},
{m:4,t:"تحدي مهندسة الروبوت الذكي",init(e){const b=e.querySelector("#f");
b.innerHTML=`<h3>أدخلي رمزك الخاص</h3><div class="row"><input type="text" id="code" placeholder="مثال: S7-12" maxlength="12" style="width:160px"><input type="text" id="nm" placeholder="الاسم (اختياري)" style="width:180px"><button class="pri" id="go">ابدئي التحدي</button></div><p class="sub">6 أسئلة فردية، 30 ثانية لكل سؤال.</p>`;
$("#go").onclick=()=>{const code=$("#code").value.trim().replace(/[^\w\u0600-\u06FF-]/g,"");if(!code){$("#code").focus();return}const nm=$("#nm").value.trim();
quiz(b,GF,async s=>{const r={};b.innerHTML=`<h2>نتيجتك: ${s} / 6</h2><div class="fb ${lvl(s,6)[0]}">${lvl(s,6)[1]}</div><h3>تقويم ذاتي</h3>${["أستطيع توضيح مفهوم المتغير","أستطيع التمييز بين مفهوم المتغير والتعبير الشرطي"].map((t,i)=>`<div class="row"><span class="lab">${t}</span><button data-i="${i}" data-v="أتقنت">أتقنت</button><button data-i="${i}" data-v="أحتاج إلى تدريب">أحتاج إلى تدريب</button></div>`).join("")}<p id="st" class="sub"></p>`;
const save=async()=>{const st=$("#st");const sum=`الرمز ${code} | النتيجة ${s}/6 | ${r[0]||"-"} | ${r[1]||"-"}`;try{const db=await claude.use("db");if(!db)throw 0;await db.collection("results").doc(code).set({code,name:nm,score:s,self1:r[0]||"",self2:r[1]||"",at:new Date().toISOString()});st.textContent="✅ تم تسجيل نتيجتك لدى المعلمة.";}catch(x){st.textContent="⚠️ تعذّر الإرسال التلقائي من هذا الجهاز. اكتبي هذه النتيجة للمعلمة: "+sum}};
b.querySelectorAll("button").forEach(x=>x.onclick=()=>{r[x.dataset.i]=x.dataset.v;b.querySelectorAll(`button[data-i="${x.dataset.i}"]`).forEach(y=>y.classList.toggle("ok",y===x));save()})})};},h:`<span class="tag">غلق ختامي فردي</span><h2>🏆 تحدي مهندسة الروبوت الذكي</h2><div id="f"></div>${ev("قياس الهدفين معًا؛ نتائج الطالبات تُسجَّل آليًا لدى المعلمة (التقويم الختامي).")}`},
{m:0,t:"أدلة التحقق والمعايير",h:`<h2>📋 أدلة تحقق الأهداف ومعايير الرخصة المهنية</h2><table><tr><th>المجال</th><th>الدليل في الحصة</th></tr><tr><td>التخطيط</td><td>هدفان قابلان للقياس، وزمن محدد لكل مرحلة (45 د)</td></tr><tr><td>استراتيجيات التدريس والتعلم النشط</td><td>اكتشاف تفاعلي، أسئلة سابرة، نشاطان جماعيان</td></tr><tr><td>التقويم والتغذية الراجعة</td><td>غلقان بنائيان وغلق ختامي فردي مع تغذية فورية ونتائج مسجلة</td></tr><tr><td>التمايز</td><td>نشاط علاجي وتحدٍ إثرائي بحسب نتيجة كل طالبة</td></tr><tr><td>توظيف التقنية</td><td>ألعاب تفاعلية، مؤقتات، شريط تقدم، جمع نتائج آلي</td></tr></table><div id="tv"></div>`,init(e){if(location.hash!=="#teacher")return;e.querySelector("#tv").innerHTML="<h3>نتائج الطالبات (عرض المعلمة)</h3><div id='tb'>جارٍ التحميل…</div>";(async()=>{try{const db=await claude.use("db");db.collection("results").onSnapshot(s=>{const d=s.docs.map(x=>x.data());$("#tb").innerHTML=d.length?`<table><tr><th>الرمز</th><th>الاسم</th><th>النتيجة /6</th><th>تقويم 1</th><th>تقويم 2</th></tr>${d.map(x=>`<tr><td>${x.code}</td><td>${x.name||""}</td><td>${x.score}</td><td>${x.self1}</td><td>${x.self2}</td></tr>`).join("")}</table>`:"لا توجد نتائج بعد."},()=>{$("#tb").textContent="لا تملكين صلاحية قراءة النتائج."})}catch(x){$("#tb").textContent="غير متاح."}})()}}
];
function go(n){clr();cur=Math.max(0,Math.min(S.length-1,n));const s=S[cur];app.innerHTML=`<div class="card"><div class="sub">${s.t}</div>${s.h}</div>`;$("#min").textContent=s.m?`⏱ ${s.m} د`:"";$("#pg").style.width=((cur+1)/S.length*100)+"%";$("#pv").disabled=cur==0;$("#nx").disabled=cur==S.length-1;if(s.init)s.init(app);scrollTo(0,0);if(cur>0&&!lessonT)lessonT=setInterval(()=>{left=Math.max(0,left-1);$("#clk").textContent=String(left/60|0).padStart(2,"0")+":"+String(left%60).padStart(2,"0")},1000)}
$("#pv").onclick=()=>go(cur-1);$("#nx").onclick=()=>go(cur+1);
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowLeft")go(cur+1);if(e.key==="ArrowRight")go(cur-1)});
go(0);
</script>
</body>
</html>
